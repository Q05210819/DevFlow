name: devflow-test
services:
  postgres:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_USER: devflow_test
      POSTGRES_PASSWORD: devflow_test
      POSTGRES_DB: devflow_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow_test -d devflow_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - test-postgres:/var/lib/postgresql/data

  # Real Milvus integration is opt-in: add `--profile milvus` and wait for
  # the milvus service. It uses only test-prefixed volumes and loopback ports.
  etcd:
    profiles: ["milvus"]
    image: quay.io/coreos/etcd:v3.5.25@sha256:52f17f7e56e4f7239f0320dbfcbcc24721163d7d78ae710b466af3254ccf6366
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - test-etcd:/etcd

  minio:
    profiles: ["milvus"]
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z@sha256:1dce27c494a16bae114774f1cec295493f3613142713130c2d22dd5696be6ad3
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - test-minio:/minio_data

  milvus:
    profiles: ["milvus"]
    image: milvusdb/milvus:v2.6.26@sha256:f43e0cd0c9912c35379c349f7f3a3a806b9308462d43d1bfa18d007c6642d693
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_REGION: us-east-1
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    volumes:
      - test-milvus:/var/lib/milvus

  # Optional real model worker against the isolated test stack:
  # `--profile milvus --profile models`. Defaults keep `docker compose config`
  # executable without host model files; MODEL_DEVICE/MODEL_DTYPE must still be
  # supplied to actually start it (no implicit CPU selection).
  model-worker:
    profiles: ["models"]
    image: devflow-backend-models:${DEVFLOW_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
      target: model-runtime
    command: [uv, run, --no-sync, python, -m, devflow.worker]
    environment:
      APP_ENV: test
      PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql+psycopg://devflow_test:devflow_test@postgres:5432/devflow_test
      MILVUS_URI: http://milvus:19530
      WORKER_ROLE: model
      WORKER_CONCURRENCY: "1"
      MODEL_EMBEDDING_PATH: ${TEST_MODEL_EMBEDDING_CONTAINER_PATH:-/models/bge-m3}
      MODEL_RERANKER_PATH: ${TEST_MODEL_RERANKER_CONTAINER_PATH:-/models/bge-reranker-v2-m3}
      MODEL_DEVICE: ${TEST_MODEL_DEVICE:-}
      MODEL_DTYPE: ${TEST_MODEL_DTYPE:-}
      MODEL_LOCK_PATH: /var/lib/devflow/model/model-owner.lock
      MODEL_STARTUP_TIMEOUT_SECONDS: ${TEST_MODEL_STARTUP_TIMEOUT_SECONDS:-1800}
      MODEL_DRAIN_TIMEOUT_SECONDS: ${TEST_MODEL_DRAIN_TIMEOUT_SECONDS:-120}
      KNOWLEDGE_TOKENIZER_PATH: ${TEST_MODEL_TOKENIZER_PATH:-/models/bge-m3}
    volumes:
      - test-workspace:/var/lib/devflow/workspace
      - test-model-owner:/var/lib/devflow/model
      - ${TEST_MODEL_DIR:-./.models}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    stop_grace_period: 150s
    restart: "no"

volumes:
  test-postgres:
  test-etcd:
  test-minio:
  test-milvus:
  test-workspace:
  test-model-owner:
