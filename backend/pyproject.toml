[project]
name = "devflow"
version = "0.1.0"
description = "DevFlow API and worker foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.1",
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymilvus==2.6.17",
    "sqlalchemy[asyncio]>=2.1.1",
    "tokenizers>=0.23.3,<0.24",
    "transformers>=5.20.2,<6",
    "uvicorn>=0.54.0",
]

[project.scripts]
devflow-worker = "devflow.worker:main"

[project.optional-dependencies]
models = [
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

# The model runtime is CPU-only until a CUDA host is explicitly validated.
# Resolve ``torch`` from PyTorch's CPU index so a plain ``models`` extra can
# never silently install a CUDA build with its NVIDIA runtime packages.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
